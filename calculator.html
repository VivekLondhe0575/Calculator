<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        #calculator {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 25px;
            width: 380px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .display-container {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #667eea;
        }
        #result {
            width: 100%;
            height: 70px;
            font-size: 32px;
            text-align: right;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: white;
            font-weight: bold;
            color: #333;
        }
        #result:focus {
            outline: none;
            border: 2px solid #667eea;
        }
        .info {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        button {
            height: 60px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        button:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        button:active {
            transform: translateY(0);
        }
        button.operator {
            background-color: #f39c12;
        }
        button.operator:hover {
            background-color: #e67e22;
        }
        button.equals {
            background-color: #27ae60;
            grid-column: span 2;
        }
        button.equals:hover {
            background-color: #229954;
        }
        button.clear {
            background-color: #e74c3c;
            grid-column: span 2;
        }
        button.clear:hover {
            background-color: #c0392b;
        }
        button.backspace {
            background-color: #3498db;
        }
        button.backspace:hover {
            background-color: #2980b9;
        }
        button:focus {
            border: 2px solid #fff;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="calculator">
        <h1>Calculator</h1>
        <div class="display-container">
            <input type="text" id="result" disabled placeholder="0" />
            <div class="info">Use keyboard or click buttons • Backspace (←) to delete</div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="clearResult()">C</button>
            <button class="backspace" onclick="backspace()">← Backspace</button>
            <button class="operator" onclick="appendToResult('/')" title="Divide">÷</button>
            <button class="operator" onclick="appendToResult('*')" title="Multiply">×</button>
            
            <button onclick="appendToResult('7')">7</button>
            <button onclick="appendToResult('8')">8</button>
            <button onclick="appendToResult('9')">9</button>
            <button class="operator" onclick="appendToResult('-')" title="Subtract">−</button>
            <button style="grid-row: span 1;"></button>
            
            <button onclick="appendToResult('4')">4</button>
            <button onclick="appendToResult('5')">5</button>
            <button onclick="appendToResult('6')">6</button>
            <button class="operator" onclick="appendToResult('+')" title="Add">+</button>
            <button style="grid-row: span 1;"></button>
            
            <button onclick="appendToResult('1')">1</button>
            <button onclick="appendToResult('2')">2</button>
            <button onclick="appendToResult('3')">3</button>
            <button onclick="appendToResult('.')">.</button>
            <button style="grid-row: span 1;"></button>
            
            <button onclick="appendToResult('0')" style="grid-column: span 2;">0</button>
            <button class="equals" onclick="calculateResult()" style="grid-column: span 3;">=</button>
        </div>
    </div>

    <script>
        const resultField = document.getElementById('result');

        // Keyboard Support
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= '0' && key <= '9') {
                appendToResult(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendToResult(key);
            } else if (key === '.') {
                appendToResult('.');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (key === 'Backspace') {
                event.preventDefault();
                backspace();
            } else if (key === 'Escape') {
                event.preventDefault();
                clearResult();
            }
        });

        function appendToResult(value) {
            if (resultField.value === '0' && value !== '.') {
                resultField.value = value;
            } else {
                resultField.value += value;
            }
        }

        function clearResult() {
            resultField.value = '0';
        }

        function backspace() {
            const current = resultField.value;
            if (current.length > 1) {
                resultField.value = current.slice(0, -1);
            } else {
                resultField.value = '0';
            }
        }

        function calculateResult() {
            try {
                const result = eval(resultField.value);
                resultField.value = result;
            } catch (error) {
                resultField.value = 'Error';
                setTimeout(() => {
                    resultField.value = '0';
                }, 1500);
            }
        }

        // Initialize display
        resultField.value = '0';
    </script>
</body>
</html>
